# Back from the screen showing FROM until EXPECT shows, at most three times. A
# lost Back is taken again only while FROM is still on screen, so a Back the
# app did take is never repeated past the screen it led to.
#
#   - runFlow:
#       file: ci-tools/back-until.yaml
#       env:
#         FROM: "<something only this screen shows>"
#         EXPECT: "<something only the screen behind it shows>"
appId: ${APP_ID}
---
- retry:
    maxRetries: 2
    commands:
      - runFlow:
          when:
            visible: ${FROM}
          commands:
            - runFlow: back.yaml
      - extendedWaitUntil:
          visible: ${EXPECT}
          timeout: 20000
