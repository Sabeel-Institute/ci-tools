# A static build (ffmpeg 7.0.2 with libx265, from ffmpeg-static's GitHub
# release) instead of apt: the runners' apt mirror held one install for 41
# minutes and stalls about one in five. ffprobe comes with it, as it does
# with the distribution package.
- name: Install ffmpeg
  timeout-minutes: 5
  run: |
    dir="$RUNNER_TEMP/ffmpeg"
    base=https://github.com/eugeneware/ffmpeg-static/releases/download/b6.1.1
    mkdir -p "$dir"
    curl -fsSL --retry 3 -o "$dir/ffmpeg.gz" "$base/ffmpeg-linux-x64.gz"
    curl -fsSL --retry 3 -o "$dir/ffprobe.gz" "$base/ffprobe-linux-x64.gz"
    printf '%s  %s\n' \
      bfe8a8fc511530457b528c48d77b5737527b504a3797a9bc4866aeca69c2dffa "$dir/ffmpeg.gz" \
      25d9b6ccb05e3d9de9e04e31e2506d8dd7f9f0418981965ac6df12e8d3afd067 "$dir/ffprobe.gz" | sha256sum -c -
    gunzip "$dir/ffmpeg.gz" "$dir/ffprobe.gz"
    chmod +x "$dir/ffmpeg" "$dir/ffprobe"
    echo "$dir" >> "$GITHUB_PATH"
    "$dir/ffmpeg" -hide_banner -encoders | grep -q libx265
