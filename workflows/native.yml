name: Native

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: native-${{ github.ref }}
  cancel-in-progress: true

env:
  SENTRY_DISABLE_AUTO_UPLOAD: "true"

jobs:
  # Whether the pull request changes documentation alone (sabeel-ci
  # docs-only): then neither platform runs, and the native check passes over
  # them.
  changes:
    if: github.repository_owner == 'Sabeel-Institute'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      docs-only: ${{ steps.changes.outputs.docs-only }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 2
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      # ci-tools: ci-tools
      - name: Does the pull request change documentation alone
        id: changes
        run: sabeel-ci docs-only

  # The Expo fingerprint of each platform's native inputs: the key its debug
  # build is kept under (the native-fingerprint command). A debug build loads
  # its JavaScript from Metro, so a commit that changes no native input runs
  # the flows on the build already kept for its key, from main or from an
  # earlier run of this pull request.
  fingerprint:
    if: github.repository_owner == 'Sabeel-Institute'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      android: ${{ steps.keys.outputs.android }}
      ios: ${{ steps.keys.outputs.ios }}
      ios-kept: ${{ steps.ios-kept.outputs.cache-hit }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      # ci-tools: ci-tools
      - name: Install dependencies
        run: npm ci
      - name: Fingerprint the native inputs
        id: keys
        run: sabeel-ci native-fingerprint debug
      # Read by the iOS job's condition on a main push, which has no flows to
      # run once the build is kept.
      - name: Is the iOS build kept already
        id: ios-kept
        uses: actions/cache/restore@v6
        with:
          path: ~/native-build
          key: ${{ steps.keys.outputs.ios }}
          lookup-only: true

  android:
    needs: [changes, fingerprint]
    if: needs.changes.outputs.docs-only != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      # ci-tools: ci-tools
      - name: Install dependencies
        run: npm ci
      - name: The debug APK, if kept for these native inputs
        id: kept
        uses: actions/cache/restore@v6
        with:
          path: ~/native-build
          key: ${{ needs.fingerprint.outputs.android }}
      # Gradle's cache only for a build: restoring it took half a minute that
      # the kept APK has no use for.
      - name: JDK 21, with Gradle's cache for the build
        if: steps.kept.outputs.cache-hit != 'true'
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
          cache: gradle
      - name: JDK 21
        if: steps.kept.outputs.cache-hit == 'true'
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
      - name: Android SDK packages, with retries
        if: steps.kept.outputs.cache-hit != 'true'
        run: sabeel-ci ci-android-sdk
      - name: Build the debug APK
        if: steps.kept.outputs.cache-hit != 'true'
        run: sabeel-ci native-build android ~/native-build
      # Kept before the flows run, so a failed flow still leaves the build.
      - name: Keep the debug APK for these native inputs
        if: steps.kept.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: ~/native-build
          key: ${{ needs.fingerprint.outputs.android }}
      - name: Install Firebase CLI
        id: firebase-cli
        run: |
          npm install --global firebase-tools@^15
          echo "version=$(firebase --version)" >> "$GITHUB_OUTPUT"
      # The emulators' jars and the Emulator UI download on their first start, and
      # a download that fails ends the emulators: kept per Firebase CLI version.
      - uses: actions/cache@v6
        with:
          path: ~/.cache/firebase/emulators
          key: firebase-emulators-${{ runner.os }}-${{ steps.firebase-cli.outputs.version }}
      # ci-tools: ffmpeg if ci.ffmpeg
      # ci-tools: media-store if ci.mediaStore
      # ci-tools: seed-browser if native.seedWeb
      - name: Boot an Android emulator
        run: sabeel-ci ci-avd
      - name: Install Maestro
        run: sabeel-ci install-maestro
      - name: Native flows
        run: sabeel-ci native-e2e --build ~/native-build
      - name: Screens, Maestro's report and logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: native-${{ github.sha }}
          path: shots/native/
          retention-days: 14

  # On a main push it runs only to keep a build for new native inputs, and
  # runs the flows on it while it is there.
  ios:
    needs: [changes, fingerprint]
    if: needs.changes.outputs.docs-only != 'true' && (github.event_name != 'push' || startsWith(github.ref, 'refs/tags/v') || needs.fingerprint.outputs.ios-kept != 'true')
    runs-on: macos-26
    timeout-minutes: 120
    steps:
      # Spotlight indexes every file the install and the build write, on a
      # runner whose few cores the simulator already saturates (load averages
      # past 300 in the flows). The flows' taps and keystrokes need what is left.
      - name: Stop Spotlight indexing
        run: sudo mdutil -a -i off
      # macOS hands out temporary ports from 49152-65535, which holds every
      # app's emulator block (61000 up, above Linux's 32768-60999): a
      # connection that drew 61303 kept the Functions emulator from starting.
      - name: End the temporary port range below the emulator blocks
        run: sudo sysctl -w net.inet.ip.portrange.last=60999 net.inet.ip.portrange.hilast=60999
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      # ci-tools: ci-tools
      # First, so the eleven minutes a new simulator keeps the Mac busy pass
      # under the setup and any build (sabeel-ci ios-boot).
      - name: Start booting the iOS simulator
        run: sabeel-ci ios-boot
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
      - name: Install dependencies
        run: npm ci
      - name: The debug app, if kept for these native inputs
        id: kept
        uses: actions/cache/restore@v6
        with:
          path: ~/native-build
          key: ${{ needs.fingerprint.outputs.ios }}
      # pod install takes React Native's prebuilt iOS binaries (160 MB from
      # Maven Central, which can stall for hours) from this folder when they
      # are there, after checking each against Maven's SHA-1. Kept per React
      # Native version, and only after a build that fetched them succeeded.
      - name: React Native's version
        id: react-native
        if: steps.kept.outputs.cache-hit != 'true'
        working-directory: app
        run: echo "version=$(node -p "require('react-native/package.json').version")" >> "$GITHUB_OUTPUT"
      - name: React Native's iOS binaries, if kept for this version
        id: rn-binaries
        if: steps.kept.outputs.cache-hit != 'true'
        uses: actions/cache/restore@v6
        with:
          path: ~/Library/Caches/ReactNative
          key: react-native-ios-${{ steps.react-native.outputs.version }}
      - name: Build the debug app for the iOS simulator
        if: steps.kept.outputs.cache-hit != 'true'
        run: sabeel-ci native-build ios ~/native-build
      - name: Keep React Native's iOS binaries for this version
        if: steps.kept.outputs.cache-hit != 'true' && steps.rn-binaries.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: ~/Library/Caches/ReactNative
          key: react-native-ios-${{ steps.react-native.outputs.version }}
      - name: Keep the debug app for these native inputs
        if: steps.kept.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: ~/native-build
          key: ${{ needs.fingerprint.outputs.ios }}
      - name: Install Firebase CLI
        id: firebase-cli
        run: |
          npm install --global firebase-tools@^15
          echo "version=$(firebase --version)" >> "$GITHUB_OUTPUT"
      # The emulators' jars and the Emulator UI download on their first start, and
      # a download that fails ends the emulators: kept per Firebase CLI version.
      - uses: actions/cache@v6
        with:
          path: ~/.cache/firebase/emulators
          key: firebase-emulators-${{ runner.os }}-${{ steps.firebase-cli.outputs.version }}
      # ci-tools: ffmpeg-macos if ci.ffmpeg
      # ci-tools: media-store-macos if ci.mediaStore
      # ci-tools: seed-browser-macos if native.seedWeb
      - name: Install Maestro
        run: sabeel-ci install-maestro
      - name: Native flows on the iOS simulator
        run: sabeel-ci native-e2e --ios --build ~/native-build
      - name: Screens, Maestro's report and logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: native-ios-${{ github.sha }}
          path: shots/native/
          retention-days: 14

  # The check main's ruleset requires. A pull request runs both platforms,
  # unless the changes job found it to be documentation alone; any other
  # skipped or cancelled platform fails it, as a skipped required check would
  # otherwise pass.
  native:
    if: always() && github.event_name == 'pull_request'
    needs: [changes, android, ios]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require the flows on Android and iOS
        env:
          JOB_RESULTS: ${{ toJSON(needs) }}
        run: |
          node -e '
            const jobs = JSON.parse(process.env.JOB_RESULTS);
            const names = ["changes", "android", "ios"];
            const docsOnly = jobs.changes?.result === "success" && jobs.changes.outputs?.["docs-only"] === "true";
            const passed = (name) => jobs[name]?.result === "success" || (docsOnly && name !== "changes" && jobs[name]?.result === "skipped");
            if (Object.keys(jobs).length !== names.length || !names.every(passed)) process.exit(1);'
