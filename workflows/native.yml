name: Native

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: native-${{ github.ref }}
  cancel-in-progress: true

env:
  SENTRY_DISABLE_AUTO_UPLOAD: "true"

jobs:
  android:
    if: github.repository_owner == 'Sabeel-Institute'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      # ci-tools: ci-tools
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
          cache: gradle
      - name: Install dependencies
        run: npm ci
      - name: Android SDK packages, with retries
        run: sabeel-ci ci-android-sdk
      - name: Install Firebase CLI
        id: firebase-cli
        run: |
          npm install --global firebase-tools@^15
          echo "version=$(firebase --version)" >> "$GITHUB_OUTPUT"
      # The emulators' jars and the Emulator UI download on their first start, and
      # a download that fails ends the emulators: kept per Firebase CLI version.
      - uses: actions/cache@v6
        with:
          path: ~/.cache/firebase/emulators
          key: firebase-emulators-${{ runner.os }}-${{ steps.firebase-cli.outputs.version }}
      # ci-tools: ffmpeg if ci.ffmpeg
      # ci-tools: media-store if ci.mediaStore
      # ci-tools: seed-browser if native.seedWeb
      - name: Boot an Android emulator
        run: sabeel-ci ci-avd
      - name: Install Maestro
        run: sabeel-ci install-maestro
      - name: Native flows
        run: sabeel-ci native-e2e
      - name: Screens, Maestro's report and logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: native-${{ github.sha }}
          path: shots/native/
          retention-days: 14

  ios:
    if: github.repository_owner == 'Sabeel-Institute' && (startsWith(github.ref, 'refs/tags/v') || github.event_name != 'push')
    runs-on: macos-26
    timeout-minutes: 120
    steps:
      # Spotlight indexes every file the install and the build write, on a
      # runner whose few cores the simulator already saturates (load averages
      # past 300 in the flows). The flows' taps and keystrokes need what is left.
      - name: Stop Spotlight indexing
        run: sudo mdutil -a -i off
      # macOS hands out temporary ports from 49152-65535, which holds every
      # app's emulator block (61000 up, above Linux's 32768-60999): a
      # connection that drew 61303 kept the Functions emulator from starting.
      - name: End the temporary port range below the emulator blocks
        run: sudo sysctl -w net.inet.ip.portrange.last=60999 net.inet.ip.portrange.hilast=60999
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      # ci-tools: ci-tools
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
      - name: Install dependencies
        run: npm ci
      - name: Install Firebase CLI
        id: firebase-cli
        run: |
          npm install --global firebase-tools@^15
          echo "version=$(firebase --version)" >> "$GITHUB_OUTPUT"
      # The emulators' jars and the Emulator UI download on their first start, and
      # a download that fails ends the emulators: kept per Firebase CLI version.
      - uses: actions/cache@v6
        with:
          path: ~/.cache/firebase/emulators
          key: firebase-emulators-${{ runner.os }}-${{ steps.firebase-cli.outputs.version }}
      # ci-tools: ffmpeg-macos if ci.ffmpeg
      # ci-tools: media-store-macos if ci.mediaStore
      # ci-tools: seed-browser-macos if native.seedWeb
      - name: Install Maestro
        run: sabeel-ci install-maestro
      - name: Native flows on the iOS simulator
        run: sabeel-ci native-e2e --ios
      - name: Screens, Maestro's report and logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: native-ios-${{ github.sha }}
          path: |
            shots/native/
            !shots/native/ios-build/
          retention-days: 14

  # The check main's ruleset requires. A pull request runs both platforms;
  # a skipped or cancelled one fails it, as a skipped required check would
  # otherwise pass.
  native:
    if: always() && github.event_name == 'pull_request'
    needs: [android, ios]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require the flows on Android and iOS
        env:
          JOB_RESULTS: ${{ toJSON(needs) }}
        run: |
          node -e 'const jobs = Object.values(JSON.parse(process.env.JOB_RESULTS)); if (jobs.length !== 2 || jobs.some(job => job.result !== "success")) process.exit(1);'
