name: Native

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    paths:
      - maestro/**
      - {{ci-tools.native.seed}}
      - ci-tools.json
      - .github/workflows/native.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: native-${{ github.ref }}
  cancel-in-progress: true

env:
  SENTRY_DISABLE_AUTO_UPLOAD: "true"

jobs:
  android:
    if: github.repository_owner == 'Sabeel-Institute'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      # ci-tools: ci-tools
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
          cache: gradle
      - name: Install dependencies
        run: npm ci
      - name: Android SDK packages, with retries
        run: sabeel-ci ci-android-sdk
      - name: Install Firebase CLI
        run: npm install --global firebase-tools@^15
      # ci-tools: firebase-placeholders
      # ci-tools: ffmpeg if ci.ffmpeg
      # ci-tools: media-store if ci.mediaStore
      # ci-tools: emulator-secrets
      # ci-tools: seed-browser if native.seedWeb
      - name: Boot an Android emulator
        run: sabeel-ci ci-avd
      - name: Install Maestro
        run: sabeel-ci install-maestro
      - name: Native flows
        run: sabeel-ci native-e2e
      - name: Screens, Maestro's report and logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: native-${{ github.sha }}
          path: shots/native/
          retention-days: 14

  ios:
    if: github.repository_owner == 'Sabeel-Institute' && (startsWith(github.ref, 'refs/tags/v') || github.event_name != 'push')
    runs-on: macos-26
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      # ci-tools: ci-tools
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
      # ci-tools: firebase-placeholders
      - name: Install dependencies
        run: npm ci
      - name: Install Firebase CLI
        run: npm install --global firebase-tools@^15
      # ci-tools: ffmpeg-macos if ci.ffmpeg
      # ci-tools: media-store-macos if ci.mediaStore
      # ci-tools: emulator-secrets
      # ci-tools: seed-browser-macos if native.seedWeb
      - name: Install Maestro
        run: sabeel-ci install-maestro
      - name: Native flows on the iOS simulator
        run: sabeel-ci native-e2e --ios
      - name: Screens, Maestro's report and logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: native-ios-${{ github.sha }}
          path: |
            shots/native/
            !shots/native/ios-build/
          retention-days: 14
