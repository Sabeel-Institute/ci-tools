name: Deploy Web

on:
  workflow_dispatch:
    inputs:
      build_run_id:
        description: Successful Web workflow run ID from main
        required: true
        type: string
      deploy:
        description: Publish to live Firebase Hosting (false validates authentication only)
        type: boolean
        default: false

permissions:
  contents: read
  actions: read
  id-token: write

concurrency:
  group: production-hosting
  cancel-in-progress: false

jobs:
  # The build's source maps to Sentry before the site goes live, so a crash on
  # it is readable from the first one. The Sentry token lives in release-build,
  # like every build secret; this job reads nothing else.
  sourcemaps:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && github.repository_owner == 'Sabeel-Institute' && inputs.deploy
    environment: release-build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read
    env:
      BUILD_RUN_ID: ${{ inputs.build_run_id }}
    steps:
      - name: Only the owner releases
        env:
          OWNER_ID: ${{ vars.RELEASE_OWNER_ID }}
          OWNER_LOGIN: ${{ vars.RELEASE_OWNER_LOGIN }}
          ACTOR_ID: ${{ github.actor_id }}
          TRIGGERING_ACTOR: ${{ github.triggering_actor }}
        run: |
          if [ -z "$OWNER_ID" ] || [ "$ACTOR_ID" != "$OWNER_ID" ] || [ "$TRIGGERING_ACTOR" != "$OWNER_LOGIN" ]; then
            echo "::error::Only the organization owner starts or re-runs a release; this run is $TRIGGERING_ACTOR's."
            exit 1
          fi
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      # ci-tools: ci-tools
      - name: Verify build provenance and successful CI
        id: build
        env:
          GH_TOKEN: ${{ github.token }}
        run: sabeel-ci ci-platform resolve-build
      - uses: actions/checkout@v7
        with:
          ref: ${{ steps.build.outputs.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@v8
        with:
          name: web-hosting-${{ steps.build.outputs.sha }}
          run-id: ${{ steps.build.outputs.run_id }}
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/hosting-artifact
      - name: Install checksum-pinned sentry-cli
        env:
          SENTRY_CLI: ${{ runner.temp }}/sentry-cli
        run: |
          curl --fail --silent --show-error --location --retry 3 https://github.com/getsentry/sentry-cli/releases/download/2.58.6/sentry-cli-Linux-x86_64 --output "$SENTRY_CLI"
          echo "36b689311b399d9332950d84f4299aee682d2d290a770a77372b30a74f7e7add  $SENTRY_CLI" | sha256sum --check
          chmod +x "$SENTRY_CLI"
          echo "SENTRY_CLI=$SENTRY_CLI" >> "$GITHUB_ENV"
      - name: Upload the build's source maps to Sentry
        env:
          BUILD_ENV: ${{ secrets.BUILD_ENV }}
        run: sabeel-ci ci-platform sourcemaps

  deploy:
    needs: sourcemaps
    if: ${{ !cancelled() && github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && github.repository_owner == 'Sabeel-Institute' && (needs.sourcemaps.result == 'success' || !inputs.deploy) }}
    environment: production
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      FIREBASE_PROJECT_ID: ${{ vars.FIREBASE_PROJECT_ID }}
      BUILD_RUN_ID: ${{ inputs.build_run_id }}
    steps:
      - name: Only the owner releases
        env:
          OWNER_ID: ${{ vars.RELEASE_OWNER_ID }}
          OWNER_LOGIN: ${{ vars.RELEASE_OWNER_LOGIN }}
          ACTOR_ID: ${{ github.actor_id }}
          TRIGGERING_ACTOR: ${{ github.triggering_actor }}
        run: |
          if [ -z "$OWNER_ID" ] || [ "$ACTOR_ID" != "$OWNER_ID" ] || [ "$TRIGGERING_ACTOR" != "$OWNER_LOGIN" ]; then
            echo "::error::Only the organization owner starts or re-runs a release; this run is $TRIGGERING_ACTOR's."
            exit 1
          fi
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      # ci-tools: ci-tools
      - name: Verify build provenance and successful CI
        id: build
        env:
          GH_TOKEN: ${{ github.token }}
        run: sabeel-ci ci-platform resolve-build
      - uses: actions/checkout@v7
        with:
          ref: ${{ steps.build.outputs.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@v8
        with:
          name: web-hosting-${{ steps.build.outputs.sha }}
          run-id: ${{ steps.build.outputs.run_id }}
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/hosting-artifact
      - name: Verify artifact hashes and isolate Hosting configuration
        run: |
          sabeel-ci ci-platform deploy-config
          sabeel-ci ci-hosting-smoke --preflight
      - run: npm install --global firebase-tools@^15
      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093
        with:
          project_id: ${{ vars.FIREBASE_PROJECT_ID }}
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_HOSTING_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db
      - name: Validate Hosting identity without publishing
        run: sabeel-ci ci-platform validate-auth
      - name: Publish the selected artifact to live Hosting
        if: inputs.deploy
        run: firebase deploy --only hosting --project "$FIREBASE_PROJECT_ID" --config "$RUNNER_TEMP/firebase-hosting.json" --non-interactive
      - name: Read-only post-deployment checks
        if: inputs.deploy
        run: sabeel-ci ci-hosting-smoke
